openapi: 3.0.0
info:
  title: Agiliza
  version: 1.0.0
  description: API do projeto Agiliza APP para localização de lavadeiras e gerenciamento de usuários

servers:
  - url: http://localhost:3000
    description: Servidor local
  - url: https://agiliza-backend-436a.onrender.com
    description: Servidor de produção

components:
  schemas:
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          example: João Tambue
        phone:
          type: string
          example: '923456789'
        password:
          type: string
          example: senha1234
        role:
          type: string
          enum:
            - CLIENT
            - LAVADEIRA
          default: CLIENT
      required:
        - name
        - phone
        - password

    LoginInput:
      type: object
      properties:
        phone:
          type: string
          example: '923456789'
        password:
          type: string
          example: senha1234
      required:
        - phone
        - password

    ForgotPasswordInput:
      type: object
      properties:
        phone:
          type: string
          example: '923456789'
      required:
        - phone

    ResetPasswordInput:
      type: object
      properties:
        token:
          type: string
          example: token
        password:
          type: string
          example: novasenha123
      required:
        - token
        - password

    RefreshTokenInput:
      type: object
      properties:
        refreshToken:
          type: string
          example: refreshToken
      required:
        - refreshToken

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string

    CreateLavadeiraInput:
      type: object
      properties:
        fullName:
          type: string
          example: Maria Silva
        bio:
          type: string
          example: Lavadeira com 5 anos de experiência
        profileImage:
          type: string
          format: url
          example: https://example.com/image.jpg
        province:
          type: string
          example: Luanda
        municipality:
          type: string
          example: Luanda
        neighborhood:
          type: string
          example: Maianga
        addressDetail:
          type: string
          example: Rua 23, Casa 45
      required:
        - fullName

    RegisterMamaInput:
      type: object
      properties:
        fullName:
          type: string
          example: Maria da Silva
          description: Nome completo (mínimo 3 caracteres)
        phone:
          type: string
          example: '923456789'
          description: Telefone único (9-15 dígitos)
        bio:
          type: string
          example: Tenho 15 anos de experiência em lavagem
          description: Biografia (opcional)
        profileImage:
          type: string
          format: binary
          description: Imagem de perfil opcional (upload de arquivo local)
        province:
          type: string
          example: Luanda
          description: Província (obrigatória)
        municipality:
          type: string
          example: Luanda
          description: Município (obrigatório)
        neighborhood:
          type: string
          example: Maianga
          description: Bairro (opcional)
        addressDetail:
          type: string
          example: Rua 23, Casa 45
          description: Detalhes do endereço (opcional)
      required:
        - fullName
        - phone
        - province
        - municipality

    SubscribeInput:
      type: object
      properties:
        plan:
          type: string
          enum:
            - BASE
            - MEDIUM
            - PRO
          description: Tipo de plano (BASE=200Kz/1mês, MEDIUM=400Kz/2meses, PRO=600Kz/3meses)
      required:
        - plan

    CreateOrderInput:
      type: object
      properties:
        lavadeiraId:
          type: string
          description: ID da lavadeira a ser contratada
        serviceDescription:
          type: string
          description: Descrição do serviço solicitado
        clientAddress:
          type: string
          description: Endereço do cliente para o serviço
        clientPhone:
          type: string
          description: Telefone de contacto do cliente
      required:
        - lavadeiraId

    UpdateOrderStatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
            - PENDING
            - CONTACTED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          description: Novo estado do pedido
        adminNotes:
          type: string
          description: Notas do administrador sobre o pedido
      required:
        - status

    UpdateUserStatusInput:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - SUSPENDED
            - PENDING
          description: Novo estado da conta
      required:
        - status

    UpdateAvailabilityInput:
      type: object
      properties:
        isAvailable:
          type: boolean
          description: Disponibilidade da lavadeira
      required:
        - isAvailable

    CreateReviewInput:
      type: object
      properties:
        lavadeiraId:
          type: string
          description: ID da lavadeira a ser avaliada
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Classificação de 1 a 5
        comment:
          type: string
          description: Comentário sobre o serviço (opcional, máx 500 caracteres)
      required:
        - lavadeiraId
        - rating

    UpdateReviewInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Nova classificação de 1 a 5
        comment:
          type: string
          description: Novo comentário

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/auth/register:
    post:
      summary: Registra um novo utilizador
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Conta criada com sucesso
        '400':
          description: Dados inválidos
        '409':
          description: Telefone já está em uso

  /api/auth/login:
    post:
      summary: Faz login do utilizador
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login efetuado com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Credenciais inválidas
        '403':
          description: Telefone não verificado ou conta inativa

  /api/auth/logout:
    post:
      summary: Efetua logout do utilizador (invalida refresh token)
      tags:
        - Auth
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logout efetuado com sucesso

  /api/auth/refresh-token:
    post:
      summary: Atualiza o access token usando refresh token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Tokens atualizados com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Refresh token inválido ou expirado

  /api/auth/verify-phone:
    get:
      summary: Verifica o número de telefone através do token SMS
      tags:
        - Auth
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: Token de verificação de 6 caracteres
      responses:
        '200':
          description: Telefone verificado com sucesso
        '400':
          description: Token inválido ou expirado

  /api/auth/forgot-password:
    post:
      summary: Solicita redefinição de senha (envia SMS)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '200':
          description: Instruções enviadas (mesmo que o telefone não exista por segurança)
        '400':
          description: Dados inválidos

  /api/auth/reset-password:
    post:
      summary: Redefine a senha usando o token do SMS
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Senha redefinida com sucesso
        '400':
          description: Token inválido ou expirado

  /api/auth/get-me:
    get:
      summary: Obtém o perfil do usuário autenticado
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil do usuário obtido com sucesso
        '404':
          description: Usuário não encontrado

  /api/auth/update-profile:
    put:
      summary: Atualiza o perfil do usuário
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Perfil do usuário atualizado com sucesso
        '404':
          description: Usuário não encontrado

  /api/lavadeiras/registerLavadeira:
    post:
      summary: Cadastra um novo perfil de lavadeira
      tags:
        - Lavadeiras
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLavadeiraInput'
      responses:
        '201':
          description: Lavadeira cadastrada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Autenticação obrigatória
        '409':
          description: Usuário já possui um registro de lavadeira

  /api/lavadeiras:
    get:
      summary: Lista todas as lavadeiras disponíveis
      tags:
        - Lavadeiras
      responses:
        '200':
          description: Lista de lavadeiras

  /api/lavadeiras/users:
    get:
      summary: Lista todos os usuários com role LAVADEIRA
      tags:
        - Lavadeiras
      responses:
        '200':
          description: Lista de usuários com role LAVADEIRA

  /api/lavadeiras/{id}:
    get:
      summary: Busca uma lavadeira pelo ID
      tags:
        - Lavadeiras
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da lavadeira
      responses:
        '200':
          description: Dados da lavadeira
        '404':
          description: Lavadeira não encontrada

  /api/lavadeiras/signup:
    post:
      summary: Registra uma nova mamã na plataforma como lavadeira
      description: Endpoint público para que mamãs possam se cadastrar na plataforma. Cria automaticamente um usuário e um perfil de lavadeira. A mamã recebe uma senha temporária que deve ser alterada no primeiro login.
      tags:
        - Lavadeiras
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterMamaInput'
      responses:
        '201':
          description: Mamã cadastrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Mamã cadastrada com sucesso!
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                        example: uuid
                      phone:
                        type: string
                        example: '923456789'
                      temporaryPassword:
                        type: string
                        example: abc123def456
                      message:
                        type: string
                        example: Você deve alterar esta senha no primeiro login
                      lavadeira:
                        type: object
                        properties:
                          id:
                            type: string
                          fullName:
                            type: string
                          bio:
                            type: string
                          profileImage:
                            type: string
                          province:
                            type: string
                          municipality:
                            type: string
                          neighborhood:
                            type: string
                          addressDetail:
                            type: string
                          isAvailable:
                            type: boolean
                          ratingAvg:
                            type: number
                          totalReviews:
                            type: integer
        '400':
          description: Dados inválidos
        '409':
          description: Já existe uma conta registrada com esse número de telefone

  /api/lavadeiras/all:
    get:
      summary: Lista todas as mamãs cadastradas na plataforma
      description: Retorna uma lista de todas as mamãs com seus perfis completos, ordenadas por data de cadastro (mais recentes primeiro).
      tags:
        - Lavadeiras
      responses:
        '200':
          description: Lista de mamãs cadastradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: uuid
                        fullName:
                          type: string
                          example: Maria da Silva
                        bio:
                          type: string
                          example: Tenho 15 anos de experiência
                        profileImage:
                          type: string
                          format: url
                        province:
                          type: string
                          example: Luanda
                        municipality:
                          type: string
                          example: Luanda
                        neighborhood:
                          type: string
                          example: Maianga
                        ratingAvg:
                          type: number
                          example: 4.5
                        totalReviews:
                          type: integer
                          example: 12
                        isAvailable:
                          type: boolean
                          example: true
                        user:
                          type: object
                          properties:
                            phone:
                              type: string
                            status:
                              type: string
                              enum:
                                - ACTIVE
                                - INACTIVE
                                - SUSPENDED
                                - PENDING
                  total:
                    type: integer
                    example: 5

  /api/subscriptions/plans:
    get:
      summary: Lista todos os planos disponíveis
      description: Retorna os planos de subscrição disponíveis com preços e durações
      tags:
        - Subscriptions
      responses:
        '200':
          description: Lista de planos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        plan:
                          type: string
                          enum: [BASE, MEDIUM, PRO]
                        label:
                          type: string
                          example: Plano Base
                        price:
                          type: integer
                          example: 200
                        durationMonths:
                          type: integer
                          example: 1

  /api/subscriptions/subscribe:
    post:
      summary: Subscreve um plano para a lavadeira
      description: A lavadeira subscreve um plano de subscrição. Não pode ter mais de um plano ativo.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeInput'
      responses:
        '201':
          description: Plano subscrito com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas lavadeiras podem subscrever planos
        '409':
          description: Já possui um plano ativo

  /api/subscriptions/my:
    get:
      summary: Obtém a subscrição atual da lavadeira
      description: Retorna os detalhes da subscrição atual da lavadeira autenticada
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscrição obtida com sucesso
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas lavadeiras podem ver esta informação

  /api/subscriptions/all:
    get:
      summary: Lista todas as subscrições (Admin)
      description: Retorna todas as subscrições do sistema. Apenas administradores podem aceder.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de subscrições
        '403':
          description: Apenas administradores podem aceder

  /api/subscriptions/{lavadeiraId}:
    delete:
      summary: Cancela a subscrição de uma lavadeira
      description: Cancela a subscrição ativa. Pode ser feito pelo admin ou pela própria lavadeira.
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lavadeiraId
          schema:
            type: string
          required: true
          description: ID da lavadeira
      responses:
        '200':
          description: Subscrição cancelada com sucesso
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão para cancelar
        '404':
          description: Subscrição não encontrada

  /api/orders:
    post:
      summary: Cria um novo pedido de serviço
      description: O cliente cria um pedido para uma lavadeira. O pedido entra no painel admin para gestão.
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderInput'
      responses:
        '201':
          description: Pedido criado com sucesso
        '400':
          description: Dados inválidos ou lavadeira indisponível
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas clientes podem criar pedidos
        '404':
          description: Lavadeira não encontrada

  /api/orders/my:
    get:
      summary: Lista os pedidos do cliente autenticado
      description: Retorna todos os pedidos criados pelo cliente logado
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos do cliente
        '401':
          description: Autenticação obrigatória

  /api/orders/lavadeira:
    get:
      summary: Lista os pedidos dirigidos à lavadeira
      description: Retorna todos os pedidos endereçados à lavadeira autenticada
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos da lavadeira
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas lavadeiras podem aceder

  /api/orders/all:
    get:
      summary: Lista todos os pedidos (Admin)
      description: Retorna todos os pedidos do sistema. Pode filtrar por status via query param.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONTACTED, IN_PROGRESS, COMPLETED, CANCELLED]
          description: Filtrar por estado do pedido
      responses:
        '200':
          description: Lista de pedidos
        '403':
          description: Apenas administradores podem aceder

  /api/orders/{id}/status:
    patch:
      summary: Atualiza o estado do pedido (Admin)
      description: O administrador atualiza o estado e opcionalmente adiciona notas ao pedido
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID do pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusInput'
      responses:
        '200':
          description: Estado atualizado com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas administradores podem atualizar
        '404':
          description: Pedido não encontrado

  /api/orders/{id}:
    get:
      summary: Obtém detalhes de um pedido
      description: Retorna os detalhes completos de um pedido. Acesso: cliente dono do pedido, lavadeira do pedido ou admin.
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID do pedido
      responses:
        '200':
          description: Detalhes do pedido
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão para ver este pedido
        '404':
          description: Pedido não encontrado

  /api/admin/dashboard:
    get:
      summary: Obtém estatísticas do painel admin
      description: Retorna métricas gerais da plataforma (totais de utilizadores, pedidos, subscrições)
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estatísticas obtidas com sucesso
        '403':
          description: Apenas administradores podem aceder

  /api/admin/users:
    get:
      summary: Lista todos os utilizadores
      description: Retorna todos os utilizadores. Pode filtrar por role e status via query params.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          schema:
            type: string
            enum: [ADMIN, CLIENT, LAVADEIRA]
          description: Filtrar por role
        - in: query
          name: status
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, SUSPENDED, PENDING]
          description: Filtrar por estado
      responses:
        '200':
          description: Lista de utilizadores
        '403':
          description: Apenas administradores podem aceder

  /api/admin/users/{id}:
    get:
      summary: Obtém detalhes de um utilizador
      description: Retorna os detalhes completos de um utilizador, incluindo perfil de lavadeira se aplicável
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID do utilizador
      responses:
        '200':
          description: Detalhes do utilizador
        '403':
          description: Apenas administradores podem aceder
        '404':
          description: Utilizador não encontrado

  /api/admin/users/{id}/status:
    patch:
      summary: Atualiza o estado de um utilizador
      description: Ativa, desativa ou suspende um utilizador. Não é possível alterar estado de administradores.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID do utilizador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusInput'
      responses:
        '200':
          description: Estado atualizado com sucesso
        '400':
          description: Estado inválido
        '403':
          description: Apenas administradores podem aceder
        '404':
          description: Utilizador não encontrado

  /api/admin/lavadeiras:
    get:
      summary: Lista todas as lavadeiras (Admin)
      description: Retorna todas as lavadeiras com dados do utilizador, subscrição e contagem de pedidos
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de lavadeiras
        '403':
          description: Apenas administradores podem aceder

  /api/admin/lavadeiras/{id}/availability:
    patch:
      summary: Ativa ou desativa disponibilidade de uma lavadeira
      description: O admin pode ativar ou desativar a visibilidade de uma lavadeira na plataforma
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da lavadeira
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAvailabilityInput'
      responses:
        '200':
          description: Disponibilidade atualizada com sucesso
        '400':
          description: Dados inválidos
        '403':
          description: Apenas administradores podem aceder
        '404':
          description: Lavadeira não encontrada

  /api/reviews:
    post:
      summary: Cria uma avaliação para uma lavadeira
      description: O cliente avalia uma lavadeira com classificação de 1 a 5 e comentário opcional. Um cliente só pode avaliar uma lavadeira uma vez.
      tags:
        - Reviews
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewInput'
      responses:
        '201':
          description: Avaliação criada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Autenticação obrigatória
        '403':
          description: Apenas clientes podem criar avaliações
        '404':
          description: Lavadeira não encontrada
        '409':
          description: Já avaliou esta lavadeira

  /api/reviews/my:
    get:
      summary: Lista as avaliações do cliente autenticado
      description: Retorna todas as avaliações feitas pelo cliente logado
      tags:
        - Reviews
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de avaliações do cliente
        '401':
          description: Autenticação obrigatória

  /api/reviews/lavadeira/{lavadeiraId}:
    get:
      summary: Lista as avaliações de uma lavadeira
      description: Retorna todas as avaliações públicas de uma lavadeira específica
      tags:
        - Reviews
      parameters:
        - in: path
          name: lavadeiraId
          schema:
            type: string
          required: true
          description: ID da lavadeira
      responses:
        '200':
          description: Lista de avaliações
        '404':
          description: Lavadeira não encontrada

  /api/reviews/{id}:
    put:
      summary: Atualiza uma avaliação
      description: O cliente pode atualizar a classificação e comentário da sua avaliação. Admin também pode editar.
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da avaliação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewInput'
      responses:
        '200':
          description: Avaliação atualizada com sucesso
        '400':
          description: Dados inválidos
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão para editar
        '404':
          description: Avaliação não encontrada
    delete:
      summary: Elimina uma avaliação
      description: O cliente pode eliminar a sua avaliação. Admin também pode eliminar.
      tags:
        - Reviews
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da avaliação
      responses:
        '200':
          description: Avaliação eliminada com sucesso
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão para eliminar
        '404':
          description: Avaliação não encontrada

  /api/notifications/my:
    get:
      summary: Lista as notificações do utilizador
      description: Retorna as 50 notificações mais recentes do utilizador autenticado
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de notificações
        '401':
          description: Autenticação obrigatória

  /api/notifications/unread-count:
    get:
      summary: Obtém a contagem de notificações não lidas
      description: Retorna o número de notificações não lidas do utilizador
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contagem obtida com sucesso
        '401':
          description: Autenticação obrigatória

  /api/notifications/{id}/read:
    patch:
      summary: Marca uma notificação como lida
      description: Marca uma notificação específica como lida
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da notificação
      responses:
        '200':
          description: Notificação marcada como lida
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão
        '404':
          description: Notificação não encontrada

  /api/notifications/read-all:
    patch:
      summary: Marca todas as notificações como lidas
      description: Marca todas as notificações não lidas do utilizador como lidas
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Todas marcadas como lidas
        '401':
          description: Autenticação obrigatória

  /api/notifications/{id}:
    delete:
      summary: Elimina uma notificação
      description: Elimina uma notificação específica do utilizador
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
          description: ID da notificação
      responses:
        '200':
          description: Notificação eliminada com sucesso
        '401':
          description: Autenticação obrigatória
        '403':
          description: Sem permissão
        '404':
          description: Notificação não encontrada

